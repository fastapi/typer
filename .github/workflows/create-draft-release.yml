name: Create Draft Release

on:
  pull_request:
    types:
      - closed

permissions: {}

jobs:
  create-draft-release:
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      PREPARE_RELEASE_VERSION_FILE: typer/__init__.py
      PREPARE_RELEASE_RELEASE_NOTES_FILE: docs/release-notes.md
    steps:
      - name: Dump GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"
      - uses: actions/checkout@v7.0.1
        with:
          # The commit this release PR merged as, not the branch tip: another PR can
          # merge between this PR merging and this job checking out the branch.
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          # Only `gh` talks to GitHub below, authenticated by GH_TOKEN.
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version-file: ".python-version"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "latest-known"
      - name: Extract release details
        id: release-details
        run: |
          set -euo pipefail
          version="$(uv run python scripts/prepare_release.py current-version)"
          uv run python scripts/prepare_release.py release-notes > draft-release-notes.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release-details.outputs.version }}
          MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" \
            --draft \
            --title "$VERSION" \
            --notes-file draft-release-notes.md \
            --target "$MERGE_COMMIT_SHA"
